<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(pageTitle, includeCsrf)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Blitz 게시판">
    <meta name="app-base-url" th:content="@{/}">
    <meta th:if="${includeCsrf && _csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${includeCsrf && _csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="|${pageTitle} · Blitz|">Blitz</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
</body>
</html>
