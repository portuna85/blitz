spring:
  datasource:
    url: ${MARIADB_URL:jdbc:mariadb://localhost:${MARIADB_HOST_PORT:13306}/${MARIADB_DATABASE:blitz}}
    username: ${MARIADB_USERNAME:blitz}
    password: ${MARIADB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-migration-naming: true
  session:
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:placeholder-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:placeholder-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
