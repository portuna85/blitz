<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: pageHead('게시글 등록', true)}"></head>
<body>
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

<header th:replace="~{layout/header :: siteHeader(@{/}, '목록으로')}"></header>

<main id="main-content" class="container main-content main-content--narrow" tabindex="-1">
    <div class="page-heading">
        <div>
            <p class="eyebrow">NEW POST</p>
            <h1>게시글 등록</h1>
            <p class="page-description">제목과 내용을 입력해 새 글을 등록하세요.</p>
        </div>
    </div>

    <div id="form-message" class="notice" data-flash-message hidden tabindex="-1"></div>

    <form id="postSaveForm" class="post-form" th:attr="data-create-url=@{/api/v1/posts}">
        <div class="form-field">
            <label for="title">제목 <span aria-hidden="true">*</span></label>
            <input type="text" id="title" name="title" required maxlength="500"
                   autocomplete="off" aria-describedby="title-hint">
            <p id="title-hint" class="field-hint">필수 입력 · 최대 500자</p>
        </div>

        <div class="form-field">
            <label for="content">내용 <span aria-hidden="true">*</span></label>
            <textarea id="content" name="content" required maxlength="10000" rows="14"
                      aria-describedby="content-hint"></textarea>
            <p id="content-hint" class="field-hint">필수 입력 · 최대 10,000자</p>
        </div>

        <div class="form-actions">
            <a class="button button--quiet" th:href="@{/}">취소</a>
            <button type="submit" class="button button--primary" id="btn-save">등록</button>
        </div>
    </form>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
