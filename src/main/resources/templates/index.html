<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>

    <h1>스프링부트로 시작하는 웹 서비스 Ver.2</h1>
    <div class="col-md-12">
        <div class="row">
            <div class="col-md-6">
                <a th:if="${userName != null}" href="/posts/save" role="button" class="btn btn-primary">글 등록</a>
                <div th:if="${userName != null}">
                    Logged in as: <span id="user" th:text="${userName}"></span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-info active">Logout</button>
                    </form>
                </div>
                <div th:unless="${userName != null}">
                    <a href="/oauth2/authorization/google" class="btn btn-success active" role="button">Google Login</a>
                    <a href="/oauth2/authorization/naver" class="btn btn-secondary active" role="button">Naver Login</a>
                </div>
            </div>
        </div>
        <br>
        <!-- 목록 출력 영역 -->
        <table class="table table-horizontal table-bordered">
            <thead class="thead-strong">
            <tr>
                <th>게시글번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>최종수정일</th>
            </tr>
            </thead>
            <tbody id="tbody">
            <tr th:each="post : ${posts.content}">
                <td th:text="${post.id}"></td>
                <td><a th:href="@{/posts/update/{id}(id=${post.id})}" th:text="${post.title}"></a></td>
                <td th:text="${post.author}"></td>
                <td th:text="${post.modifiedDate}"></td>
            </tr>
            </tbody>
        </table>
        <nav th:if="${posts.totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/(page=${posts.number - 1})}">이전</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link" th:text="${posts.number + 1} + ' / ' + ${posts.totalPages}"></span>
                </li>
                <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/(page=${posts.number + 1})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
