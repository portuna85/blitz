spring:
  application:
    name: blitz
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
