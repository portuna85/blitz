spring:
  application:
    name: blitz
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: local
  jpa:
    open-in-view: false
  threads:
    virtual:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
