<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>

<h1>게시글 수정</h1>

<div class="col-md-12">
    <div class="col-md-4">
        <div id="form-message" class="alert d-none" role="alert" aria-live="polite"></div>
        <form id="postUpdateForm">
            <div class="form-group">
                <label for="id">글 번호</label>
                <input type="text" class="form-control" id="id" th:value="${post.id}" readonly>
            </div>
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" class="form-control" id="title" th:value="${post.title}" th:readonly="${!isOwner}" required maxlength="500">
            </div>
            <div class="form-group">
                <label for="author"> 작성자 </label>
                <input type="text" class="form-control" id="author" th:value="${post.author}" readonly>
            </div>
            <div class="form-group">
                <label for="content"> 내용 </label>
                <textarea class="form-control" id="content" th:text="${post.content}" th:readonly="${!isOwner}" required maxlength="10000"></textarea>
            </div>
            <a href="/" role="button" class="btn btn-secondary">취소</a>
            <th:block th:if="${isOwner}">
                <button type="submit" class="btn btn-primary" id="btn-update">수정 완료</button>
                <button type="button" class="btn btn-danger" id="btn-delete">삭제</button>
            </th:block>
        </form>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
