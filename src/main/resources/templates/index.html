<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('게시글 목록', false)}"></head>
<body>
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

<header th:replace="~{layout/header :: siteHeader(null, null)}"></header>

<main id="main-content" class="container main-content" tabindex="-1">
    <div class="page-heading">
        <div>
            <p class="eyebrow">COMMUNITY</p>
            <h1>게시글</h1>
            <p class="page-description">새로운 이야기와 업데이트를 확인하세요.</p>
        </div>
    </div>

    <div id="flash-message" class="notice" data-flash-message hidden tabindex="-1"></div>

    <section aria-labelledby="posts-heading">
        <h2 id="posts-heading" class="visually-hidden">게시글 목록</h2>
        <div class="table-scroll">
            <table class="posts-table">
                <caption class="visually-hidden">게시글 번호, 제목, 작성자, 최종 수정일 목록</caption>
                <thead>
                <tr>
                    <th scope="col">번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">작성자</th>
                    <th scope="col">최종 수정일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="post : ${posts.content}">
                    <td class="posts-table__id" th:text="${post.id}">1</td>
                    <td>
                        <a class="post-link" th:href="@{/posts/{id}(id=${post.id})}"
                           th:text="${post.title}">게시글 제목</a>
                    </td>
                    <td th:text="${post.author}">작성자</td>
                    <td>
                        <time th:datetime="${post.modifiedDate}"
                              th:text="${post.modifiedDate}">2026-01-01T12:00:00</time>
                    </td>
                </tr>
                <tr th:if="${posts.empty}">
                    <td class="empty-state" colspan="4">아직 등록된 게시글이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="pagination" th:if="${posts.totalPages > 1}" aria-label="게시글 페이지">
            <a class="pagination__link" th:if="${posts.hasPrevious()}"
               th:href="@{/(page=${posts.number - 1},size=${posts.size})}" rel="prev">이전</a>
            <span class="pagination__link pagination__link--disabled" th:unless="${posts.hasPrevious()}"
                  aria-disabled="true">이전</span>

            <span class="pagination__status" aria-current="page">
                <span class="visually-hidden">현재 페이지 </span>
                <span th:text="${posts.number + 1}">1</span>
                <span aria-hidden="true"> / </span>
                <span class="visually-hidden">전체 페이지 </span>
                <span th:text="${posts.totalPages}">1</span>
            </span>

            <a class="pagination__link" th:if="${posts.hasNext()}"
               th:href="@{/(page=${posts.number + 1},size=${posts.size})}" rel="next">다음</a>
            <span class="pagination__link pagination__link--disabled" th:unless="${posts.hasNext()}"
                  aria-disabled="true">다음</span>
        </nav>
    </section>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
